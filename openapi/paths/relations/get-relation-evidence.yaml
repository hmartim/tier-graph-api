get:
  tags:
    - "Relations"
  summary: "Return all evidential bases associated with a relation (CQ2)."
  operationId: "getRelationEvidence"
  description: |
    Answers CQ2. The response MUST preserve the difference between multiple anchors within
    one conjunctive evidence record and multiple alternative evidence records.
  parameters:
    - name: relationId
      in: path
      required: true
      description: "Opaque identifier of the relation."
      schema:
        $ref: '../../openapi.yaml#/components/schemas/Identifier'
    - name: stance
      in: query
      required: false
      description: "Filter by stance."
      schema:
        type: string
        enum: ["supports", "refutes"]
    - name: reviewStatus
      in: query
      required: false
      description: "Filter by review status."
      schema:
        $ref: '../../openapi.yaml#/components/schemas/ReviewStatus'
  responses:
    '200':
      description: "The evidence records bearing on the relation."
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../../openapi.yaml#/components/schemas/RelationEvidence'
    '404':
      $ref: '../../openapi.yaml#/components/responses/NotFound'
