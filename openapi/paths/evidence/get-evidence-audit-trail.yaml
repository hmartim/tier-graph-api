get:
  tags:
    - "Audit"
  summary: "Return the full audit trail of one evidence record."
  operationId: "getEvidenceAuditTrail"
  description: |
    Returns the evidence record, its anchors, source-state resolutions, review events, and
    provenance activities — the full auditable history of one evidence occurrence.
  parameters:
    - name: evidenceId
      in: path
      required: true
      description: "Opaque identifier of the evidence record."
      schema:
        $ref: '../../openapi.yaml#/components/schemas/Identifier'
  responses:
    '200':
      description: "The evidence audit trail."
      content:
        application/json:
          schema:
            $ref: '../../openapi.yaml#/components/schemas/EvidenceAuditTrail'
    '404':
      $ref: '../../openapi.yaml#/components/responses/NotFound'
