get:
  tags:
    - "Introspection"
  summary: "Retrieve the predicate vocabulary."
  operationId: "getPredicates"
  description: |
    Returns the predicate vocabulary an agent may use to form relation queries. The specific
    vocabulary is declared in the `ProfileVocabulary` bound to the profile; pass `profileId`
    to scope it. Each entry mirrors a `ProfileVocabulary.predicates` declaration: the token,
    its semantics, and optionally the coarse `family` it belongs to. The
    response names the exact vocabulary version it came from, so a logged answer stays
    readable after the binding moves.
  parameters:
    - name: profileId
      in: query
      required: false
      description: "Optional profile to scope the vocabulary."
      schema:
        $ref: '../../openapi.yaml#/components/schemas/Identifier'
  responses:
    '200':
      description: "The predicate vocabulary."
      content:
        application/json:
          schema:
            type: object
            required: ["vocabularyRef", "items"]
            properties:
              vocabularyRef:
                $ref: '../../openapi.yaml#/components/schemas/VocabularyRef'
                description: "The vocabulary version these values were read from."
              items:
                type: array
                items:
                  type: object
                  required: ["predicate", "semantics"]
                  properties:
                    predicate:
                      type: string
                      description: "The predicate token."
                      minLength: 1
                    semantics:
                      type: string
                      description: "What this predicate asserts of source and target, as declared by the vocabulary."
                      minLength: 1
                    family:
                      type: string
                      description: "Optional coarse family this predicate belongs to; declared in the same vocabulary."
                      minLength: 1
                    label:
                      type: string
                      description: "Optional human-readable name. Display only."
                  additionalProperties: false
            additionalProperties: false
