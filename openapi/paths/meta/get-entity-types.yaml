get:
  tags:
    - "Introspection"
  summary: "Retrieve the entity-type vocabulary."
  operationId: "getEntityTypes"
  description: |
    Returns the `entityType` values used to classify derived entities, so an agent can filter
    or resolve within a known type space. The vocabulary is declared in the `ProfileVocabulary`
    bound to the profile; pass `profileId` to scope it. The response names the exact
    vocabulary version it came from, so a logged answer stays readable after the binding moves.
  parameters:
    - name: profileId
      in: query
      required: false
      description: "Optional profile to scope the vocabulary."
      schema:
        $ref: '../../openapi.yaml#/components/schemas/Identifier'
  responses:
    '200':
      description: "The entity-type vocabulary."
      content:
        application/json:
          schema:
            type: object
            required: ["vocabularyRef", "items"]
            properties:
              vocabularyRef:
                $ref: '../../openapi.yaml#/components/schemas/VocabularyRef'
                description: "The vocabulary version these values were read from."
              items:
                type: array
                items:
                  type: object
                  required: ["entityType", "semantics"]
                  properties:
                    entityType:
                      type: string
                      description: "The type token, as it appears in `DerivedEntity.entityType`."
                      minLength: 1
                    semantics:
                      type: string
                      description: "What this type classifies, as declared by the vocabulary."
                      minLength: 1
                    label:
                      type: string
                      description: "Optional human-readable name. Display only."
                  additionalProperties: false
            additionalProperties: false
