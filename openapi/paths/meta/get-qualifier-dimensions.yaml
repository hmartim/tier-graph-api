get:
  tags:
    - "Introspection"
  summary: "Retrieve the qualifier dimensions declared by a profile."
  operationId: "getQualifierDimensions"
  description: |
    Returns the qualifier dimensions an agent may reason about, and whether each is
    identity-relevant (i.e. participates in the relation identity key and can block merging
    when `unknown`). The operation reports the identity-relevance declarations of the exact
    `ProfileVocabulary` named by `vocabularyRef`; the vocabulary defines them, this operation
    only exposes them, and `RelationQualifier` instances do not override them — an instance
    carries the dimension, never the flag. The minimum dimensions are polarity, condition,
    scope, modality, and participantRoles; a vocabulary MAY declare more. Pass `profileId` to
    scope. Because the answer is the identity key, it is reported against an exact vocabulary
    version and stays readable after the binding moves.
  parameters:
    - name: profileId
      in: query
      required: false
      description: "Optional profile to scope the dimensions."
      schema:
        $ref: '../../openapi.yaml#/components/schemas/Identifier'
  responses:
    '200':
      description: "The qualifier dimensions."
      content:
        application/json:
          schema:
            type: object
            required: ["vocabularyRef", "items"]
            properties:
              vocabularyRef:
                $ref: '../../openapi.yaml#/components/schemas/VocabularyRef'
                description: "The vocabulary version these values were read from."
              items:
                type: array
                items:
                  type: object
                  required: ["dimension", "semantics", "identityRelevant"]
                  properties:
                    dimension:
                      type: string
                      description: "The qualifier dimension name, matching the key in `DerivedRelation.qualifiers`."
                      minLength: 1
                    semantics:
                      type: string
                      description: "What this dimension qualifies and what its values range over."
                      minLength: 1
                    identityRelevant:
                      type: boolean
                      description: "Whether this dimension participates in relation identity."
                    label:
                      type: string
                      description: "Optional human-readable name. Display only."
                  additionalProperties: false
            additionalProperties: false
