post:
  tags:
    - "Paths"
  summary: "Evaluate a caller-supplied ordered relation path at a query time."
  operationId: "validatePathAtTime"
  description: |
    Evaluates a caller-supplied ordered relation path at a query time, returning path-level
    admissibility, step-level evidential states, excluded steps, and the profile and policy
    used.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../openapi.yaml#/components/schemas/ValidatePathRequest'
  responses:
    '200':
      description: "The evaluated grounded path."
      content:
        application/json:
          schema:
            $ref: '../../openapi.yaml#/components/schemas/GroundedPath'
    '400':
      $ref: '../../openapi.yaml#/components/responses/BadRequest'
