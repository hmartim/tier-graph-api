get:
  tags:
    - "Profiles"
  summary: "Resolve an external evidence unit to its owning source state."
  operationId: "resolveSourceState"
  description: |
    Resolves an external evidence unit to the source state that controls its temporal
    admissibility, via the profile's `owner` function.

    **Conformance rule:** the result MUST come from the profile. TIER-Graph MUST NOT
    fabricate or infer a competing source state.

    The response is a `SourceStateResolution`: the resolved `SourceStateRef` plus the exact
    profile version that resolved it. Since `profileVersion` versions grounding behavior,
    two versions of one profile may legitimately resolve the same evidence unit to different
    source states, so the resolution — not the reference — carries the version.
  parameters:
    - name: profileId
      in: path
      required: true
      description: "Identifier of the grounding profile."
      schema:
        $ref: '../../openapi.yaml#/components/schemas/Identifier'
    - $ref: '../../openapi.yaml#/components/parameters/ProfileVersion'
    - name: evidenceUnitId
      in: path
      required: true
      description: "Opaque identifier of the external evidence unit."
      schema:
        $ref: '../../openapi.yaml#/components/schemas/Identifier'
  responses:
    '200':
      description: "The owning source state and the profile version that resolved it."
      content:
        application/json:
          schema:
            $ref: '../../openapi.yaml#/components/schemas/SourceStateResolution'
    '404':
      $ref: '../../openapi.yaml#/components/responses/NotFound'
