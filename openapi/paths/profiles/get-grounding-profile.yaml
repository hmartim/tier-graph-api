get:
  tags:
    - "Profiles"
  summary: "Retrieve the declared semantics and capabilities of one grounding profile."
  operationId: "getGroundingProfile"
  description: |
    Returns one `TemporalGroundingProfile`, including its declared `admissibilitySemantics`
    — the authoritative definition of what "admissible at time t" means for this profile.

    Pass `version` to retrieve an exact past version rather than the current binding. This
    is what makes a provenance record walkable: a result carrying ⟨`profileId`,
    `profileVersion`⟩ can be resolved back to the profile document that produced it, and
    hence to the `vocabularyRef` in force at that time.
  parameters:
    - name: profileId
      in: path
      required: true
      description: "Identifier of the grounding profile."
      schema:
        $ref: '../../openapi.yaml#/components/schemas/Identifier'
    - $ref: '../../openapi.yaml#/components/parameters/ProfileVersion'
  responses:
    '200':
      description: "The grounding profile."
      content:
        application/json:
          schema:
            $ref: '../../openapi.yaml#/components/schemas/TemporalGroundingProfile'
    '404':
      $ref: '../../openapi.yaml#/components/responses/ProfileUnavailable'
